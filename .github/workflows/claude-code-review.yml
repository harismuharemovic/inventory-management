# Reviews every new or updated pull request automatically.
# Based on the official example in anthropics/claude-code-action
# (examples/pr-review-comprehensive.yml).
name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          # Subscription token created with `claude setup-token`.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Shows a progress comment with checkboxes while the review runs.
          track_progress: true

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Follow the project conventions in CLAUDE.md,
            server/CLAUDE.md, and client/CLAUDE.md. Focus on:

            1. Correctness: bugs, edge cases, and error handling.
            2. Security: input validation and anything unsafe for a public repo.
            3. Performance: unnecessary work or requests.
            4. Testing: whether backend changes have pytest coverage in tests/backend.
            5. Documentation: whether non-obvious logic is commented.

            Use inline comments for specific issues and one top-level comment
            for the summary. Skip style nits.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
